name: NOVAGENTE Estética — validação inicial
on:
  push:
    branches:
      - feat/beauty-woman-ui-consolidada
  pull_request:
    paths:
      - "auth.mjs"
      - "server.mjs"
      - "public/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe
        run: npm run check
      - name: Testes de segurança e dia operacional
        run: npm test
        env:
          NOVAGENTE_PILOT_REPORT: "1"
      - name: Guardar relatório sintético da simulação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagente-estetica-dia-salao-qa
          path: artifacts/pilot-day/
          if-no-files-found: ignore
          retention-days: 14
      - name: Guardar relatório de concorrência com contas fictícias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagente-estetica-multiusuario-qa
          path: artifacts/multiuser/
          if-no-files-found: ignore
          retention-days: 14

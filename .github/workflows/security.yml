name: NOVAGENTE Estética — validação inicial
on:
  push:
    branches:
      - feat/beauty-woman-ui-consolidada
  pull_request:
    # Candidata integrada: rodar regressão para QUALQUER arquivo alterado,
    # incluindo módulos de estoque, financeiro, MFA, migrations e scripts.

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe
        run: npm run check
      - name: Pré-validação da versão candidata
        run: npm run release:preflight
      - name: Testes de segurança e dia operacional
        run: npm test
        env:
          NOVAGENTE_PILOT_REPORT: "1"
      - name: Guardar relatório sintético da simulação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagente-estetica-dia-salao-qa
          path: artifacts/pilot-day/
          if-no-files-found: ignore
          retention-days: 14
      - name: Guardar relatório de concorrência com contas fictícias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagente-estetica-multiusuario-qa
          path: artifacts/multiuser/
          if-no-files-found: ignore
          retention-days: 14

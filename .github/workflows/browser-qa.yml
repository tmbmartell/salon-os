name: NOVAGENTE Estética — navegador e responsividade

on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Obter versão de teste
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright no runner de QA
        run: npm install --no-save playwright@1.57.0
      - name: Preparar navegador Chromium isolado
        run: npx playwright install --with-deps chromium
      - name: Testar interface com banco de dados temporário
        run: node tests/browser-smoke.mjs
      - name: Guardar capturas de homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagente-estetica-browser-qa
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7

name: NOVAGENTE Estética — navegador e responsividade

on:
  pull_request:
    # Validar navegador em cada alteração do pacote integrado, sem zonas cegas.
  workflow_dispatch:

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Obter versão de teste
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright no runner de QA
        run: npm install --no-save playwright@1.57.0
      - name: Usar navegador Chrome do runner (ou instalar Chromium)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "QA_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "QA_CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "QA_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Testar interface com banco de dados temporário
        run: node tests/browser-smoke.mjs
      - name: Guardar capturas de homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagente-estetica-browser-qa
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
